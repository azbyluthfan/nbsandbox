#
# Keycloak beside the dev stack, for the end-to-end auth tests
# (make test-keycloak). Test only: fixed admin password, start-dev, plain
# http.
#
# Keycloak shares nbsandboxd's network namespace, so both it and the tests
# on the host reach it at http://127.0.0.1:8180: the tokens' issuer is the
# same everywhere, and nbsandboxd accepts plain http to a provider only on
# loopback.
services:
  nbsandboxd:
    environment:
      NBSANDBOX_OIDC_ISSUER: http://127.0.0.1:8180/realms/nbsandbox
      NBSANDBOX_OIDC_AUDIENCE: nbsandbox
      NBSANDBOX_OIDC_ID_PREFIX: kc
      NBSANDBOX_OIDC_ID_CLAIMS: sub
    ports:
      - "127.0.0.1:8180:8180"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command: ["start-dev", "--import-realm", "--http-port=8180", "--hostname=http://127.0.0.1:8180", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak-test-only
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=50"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    network_mode: service:nbsandboxd
    mem_limit: 1g
    depends_on:
      nbsandboxd: { condition: service_started }
