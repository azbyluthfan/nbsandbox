# Example Prometheus config. nbsandboxd's /metrics is internal only.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: nbsandboxd
    static_configs:
      - targets: ["nbsandboxd:8080"]
