#
# nbsandbox on Kubernetes: API processes (the REST/gRPC API) and workers
# (each run is a Pod in the runs namespace). Both need PostgreSQL and object
# storage (S3-compatible or Azure Blob Storage), which this chart doesn't
# install. See docs/kubernetes.md.

image:
  repository: ghcr.io/azbyluthfan/nbsandboxd
  tag: ""                   # default: the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The image notebooks run in (pinned by digest in production).
runnerImage: ghcr.io/azbyluthfan/nbsandbox-runner:0.3.0

api:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  service:
    type: ClusterIP
    port: 8080
    nodePort: null          # with type NodePort
  podLabels: {}
  podAnnotations: {}

worker:
  replicas: 2
  concurrency: 2            # runs at a time per worker
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # Scratch space for the runs it executes (copies of their spaces and
  # outputs): at least concurrency x 2 x uploads.maxSpace.
  scratchSize: 4Gi
  podLabels: {}
  podAnnotations: {}

# Where run Pods go. The chart creates the namespace (unless it exists),
# a deny-all NetworkPolicy for it, and a Role letting only the workers
# manage Pods there.
runs:
  namespace: nbsandbox-runs
  createNamespace: true
  runtimeClass: ""          # e.g. kata (AKS Pod Sandboxing) or gvisor; must exist
  nodeSelector: {}         # e.g. { agentpool: runs }
  tolerations: []          # e.g. [{ key: nbsandbox.io/runs, operator: Exists, effect: NoSchedule }]
  lease: 30s                # take over a lost worker's runs after this; above your database's failover time
  timeout: 10m
  memory: 2GiB
  cpus: 1
  retention: 720h

uploads:
  maxFile: 100MiB
  maxSpace: 512MiB

# PostgreSQL: a URL in a Secret (postgres://user:pass@host:5432/db?sslmode=require).
database:
  existingSecret: ""        # required
  key: database-url

# Object storage for file contents and run outputs.
storage:
  kind: s3                  # s3 | azure
  s3:
    endpoint: ""            # host[:port], no scheme
    bucket: nbsandbox
    region: ""
    tls: true
    prefix: ""
    createBucket: false
    existingSecret: ""      # with access-key and secret-key; empty: the cloud's identity (IRSA, ...)
  azure:
    accountURL: ""          # https://<account>.blob.core.windows.net
    container: nbsandbox
    prefix: ""
    createContainer: false  # Workload Identity is used (see serviceAccount)

# Callers: bearer tokens from your identity provider (recommended), and/or
# basic auth from a users file (development).
auth:
  basic: false
  usersSecret: ""           # a Secret with users.yaml, when basic is true
  # Failed basic-auth sign-ins allowed per username (and per address, see
  # trustedProxies) before 429; one more per refill.
  loginLimit:
    failures: 5
    refill: 1m
  # Your ingress controller's addresses or CIDRs, so the client's address
  # comes from X-Forwarded-For and failed sign-ins are also limited per
  # address. Empty: per username only.
  trustedProxies: []
  oidc:
    issuer: ""
    audience: ""
    idPrefix: ""
    idClaims: []
    # Token revocation (RFC 7662; Keycloak, Okta, Auth0; not Entra ID): ask
    # the provider whether each token is still active, at most every cache.
    introspection:
      clientId: ""            # set to turn it on
      secretName: ""          # a Secret with key client-secret
      url: ""                 # default: from the provider's discovery document
      cache: 30s

# The web UI, served by the API Deployment on its own port and, with the
# Ingress, at the host's root next to /v1/. It always signs people in here.
ui:
  enabled: false
  auth: oidc                # oidc: the identity provider above; basic: users.yaml (auth.basic)
  publicUrl: ""             # the address browsers open, e.g. https://nbsandbox.example.com
  session:
    idle: 1h                # signed out after this long without a request
    max: 12h                # and after this long in any case
  oidc:
    clientId: ""            # the UI's own client at the provider (a confidential web client)
    secretName: ""          # a Secret with key client-secret
    scopes: []              # default: openid, profile and the nbsandbox scopes
                            # (Entra ID: api://<nbsandbox client id>/nbsandbox.read, ...)

# Interactive sessions (docs/sessions.md): a notebook's live kernel, in a
# Pod in the runs namespace with a run's isolation. API pods reach the worker
# holding a session on its port 8091, with a shared secret: create a Secret
# with key "secret" (a long random value) and name it here. Without it,
# sessions stay off.
sessions:
  enabled: true
  secretName: ""
  idle: 30m                 # ends after no cell ran and no browser was connected this long
  max: 8h                   # and this long after it started, in any case
  perUser: 2
  perWorker: 4              # per worker pod, beside runs.concurrency

# Connections: notebooks read databases and object storage where they live
# (docs/connections.md). Each reading run gets a fetcher Pod beside its run
# Pod; fetchers reach sources only through the egress gateway, which this
# chart runs in the release namespace.
connections:
  enabled: false
  # Where connections may point: host names, "*.domain" patterns, CIDRs.
  allowed: []
  # kubernetes: Secrets in the runs namespace (the API writes managed ones;
  # fetcher Pods mount them, nbsandboxd never reads them). builtin: encrypted
  # in the database, for development, with masterKeySecret.
  secretsProvider: kubernetes
  masterKeySecret: ""       # builtin: a Secret with key master-key (openssl rand -base64 32)
  fetcherImage: ghcr.io/azbyluthfan/nbsandbox-fetcher:0.3.0
  # Each reading run's fetcher Pod, beside its run Pod: reserved like a
  # run's (requests = limits). DuckDB spills past three quarters of it.
  fetcherMemory: 1GiB
  fetcherCpus: 1
  gateway:
    # A Secret with key "key": openssl rand -base64 32. It signs runs'
    # gateway tokens (workers) and checks them (the gateway). Required.
    keySecret: ""
    replicas: 2
    resources:
      requests: { cpu: 50m, memory: 32Mi }
      limits: { memory: 256Mi }
    podLabels: {}

# The audit log (docs/operations.md#audit-log).
audit:
  enabled: true
  retention: 2160h          # 90 days
  downloads: true           # also record downloads of files and run outputs

functions:
  requireSchemas: false

# The service accounts. Annotations and pod labels are where cloud identity
# goes (AKS Workload Identity: annotation azure.workload.identity/client-id
# and pod label azure.workload.identity/use: "true").
serviceAccount:
  annotations: {}
podLabels: {}

# More NBSANDBOX_* variables for both kinds of process.
extraEnv: []

podDisruptionBudget:
  enabled: true

ingress:
  enabled: false
  className: ""
  host: ""
  tls: []
  annotations: {}
