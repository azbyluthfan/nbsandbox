# Two service accounts: the API processes can't touch Pods; only the
# workers can, and only in the runs namespace. With connections kept in
# Kubernetes Secrets, the API processes manage those Secrets (and only
# Secrets) in the runs namespace.
{{- range $role := list "api" "worker" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nbsandbox.fullname" $ }}-{{ $role }}
  labels: {{- include "nbsandbox.labels" $ | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ if or (eq $role "worker") (include "nbsandbox.apiUsesToken" $) }}true{{ else }}false{{ end }}
{{- end }}
{{- if include "nbsandbox.vault" . }}
---
# The fetchers' identity, for Vault's Kubernetes auth only: their Pods get
# a token for Vault's audience, never one for the Kubernetes API, and the
# account has no role there.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nbsandbox.fullname" . }}-fetcher
  namespace: {{ .Values.runs.namespace }}
  labels: {{- include "nbsandbox.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
