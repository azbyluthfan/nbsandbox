# Two service accounts: the API processes can't touch Pods; only the
# workers can, and only in the runs namespace.
{{- range $role := list "api" "worker" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nbsandbox.fullname" $ }}-{{ $role }}
  labels: {{- include "nbsandbox.labels" $ | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ eq $role "worker" }}
{{- end }}
