# The API processes: REST, gRPC and the event streams. They never start
# runs and have no Kubernetes permissions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nbsandbox.fullname" . }}-api
  labels: {{- include "nbsandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "nbsandbox.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels: {{- include "nbsandbox.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with merge (dict) .Values.podLabels .Values.api.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/settings: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "nbsandbox.fullname" . }}-api
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: nbsandboxd
          image: {{ include "nbsandbox.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: NBSANDBOX_ROLE, value: api }
            {{- include "nbsandbox.env" . | nindent 12 }}
          securityContext: {{- include "nbsandbox.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts: {{- include "nbsandbox.volumeMounts" . | nindent 12 }}
          {{- include "nbsandbox.probes" . | nindent 10 }}
      volumes:
        - name: data
          emptyDir: { sizeLimit: 1Gi }   # an API process keeps no run files
        {{- include "nbsandbox.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nbsandbox.fullname" . }}
  labels: {{- include "nbsandbox.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector: {{- include "nbsandbox.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      # gRPC clients speak HTTP/2 without TLS to this port (h2c): put a
      # TLS-terminating ingress or proxy in front for production.
      appProtocol: kubernetes.io/h2c
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
