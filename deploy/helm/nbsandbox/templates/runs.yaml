# The runs namespace: run Pods only, no traffic in or out, and a Role that
# lets the workers (and nobody else in this release) manage Pods there.
{{- if .Values.runs.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.runs.namespace }}
  labels:
    {{- include "nbsandbox.labels" . | nindent 4 }}
    # Run Pods meet the restricted Pod Security Standard.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
{{- end }}
---
# No ingress, no egress for anything in the namespace: notebooks have no
# network at all. Workers check it with a probe Pod and refuse runs if it
# isn't enforced (the network plugin must support NetworkPolicy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: {{ .Values.runs.namespace }}
  labels: {{- include "nbsandbox.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nbsandbox.fullname" . }}-worker
  namespace: {{ .Values.runs.namespace }}
  labels: {{- include "nbsandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]   # copying the run's files in and out, stopping the runner
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods/attach] # an interactive session's stdio (its Jupyter messages)
    verbs: [create, get]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  # The compute view's samples: what runs and sessions use, read from the
  # metrics API (metrics-server; nothing if the cluster has none).
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get]
  {{- if .Values.connections.enabled }}
  # A reading run's fetcher: its configuration Secret and its network
  # policies (its runner may reach it, and nothing else may).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, list, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [events]     # a fetcher that can't mount a referenced Secret
    verbs: [list]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nbsandbox.fullname" . }}-worker
  namespace: {{ .Values.runs.namespace }}
  labels: {{- include "nbsandbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nbsandbox.fullname" . }}-worker
subjects:
  - kind: ServiceAccount
    name: {{ include "nbsandbox.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
---
# Reading the runs namespace and, with a runtime class, checking it exists
# are cluster-scoped reads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nbsandbox.fullname" . }}-{{ .Release.Namespace }}-worker
  labels: {{- include "nbsandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nbsandbox.fullname" . }}-{{ .Release.Namespace }}-worker
  labels: {{- include "nbsandbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nbsandbox.fullname" . }}-{{ .Release.Namespace }}-worker
subjects:
  - kind: ServiceAccount
    name: {{ include "nbsandbox.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
{{- if .Values.connections.enabled }}
---
# Fetchers (one per reading run) may reach the egress gateway's port, and
# nothing else beyond their run. Each run's own policies (made by the
# worker) let only its runner in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fetchers-to-gateway
  namespace: {{ .Values.runs.namespace }}
  labels: {{- include "nbsandbox.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { nbsandbox.role: fetcher } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} } }
          podSelector:
            matchLabels: {{- include "nbsandbox.selector" . | nindent 14 }}
              app.kubernetes.io/component: gateway
      ports: [{ port: 3128, protocol: TCP }]
{{- end }}
{{- if include "nbsandbox.apiManagesSecrets" . }}
---
# The API processes write managed connections' Secrets, check referenced
# ones, and remove their own (labelled) ones: Secrets only, in the runs
# namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nbsandbox.fullname" . }}-api-secrets
  namespace: {{ .Values.runs.namespace }}
  labels: {{- include "nbsandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nbsandbox.fullname" . }}-api-secrets
  namespace: {{ .Values.runs.namespace }}
  labels: {{- include "nbsandbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nbsandbox.fullname" . }}-api-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "nbsandbox.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
{{- end }}
