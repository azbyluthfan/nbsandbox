#
# `make proto` (go tool buf generate): the plugins are Go tools pinned in
# go.mod, so nothing needs installing.
version: v2
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: ../../gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: ../../gen
    opt: paths=source_relative
