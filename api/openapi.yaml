#
# nbsandbox HTTP API. Kept in step with the route table in internal/api/routes.go:
# a test fails if a route is missing here or documented but not served.

openapi: 3.1.0
info:
  title: nbsandbox API
  version: 0.3.0
  description: |
    Run Jupyter notebooks headless in isolated spaces. Every /v1 endpoint needs
    HTTP basic auth (users.yaml) or a bearer access token from the configured
    OpenID Connect provider; each operation lists the token scope it needs
    (403 without it). Spaces belong to the caller's ID. Another caller's space
    is reported as 404, never 403.

    This spec is the reference. For how to use the endpoints together (set
    up a space, run a notebook, edit files safely, publish and call a
    function, follow progress, handle errors), see the guide in docs/api.md;
    for calling notebooks from other services, docs/functions.md.

    The optional local web UI (off by default, its own port) serves the same
    /v1 endpoints under /ui/api/as/{user}/v1/... without a password, acting
    as {user}, plus GET /ui/api/users. It is a local tool only.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://127.0.0.1:8080

security:
  - basicAuth: []
  - bearerAuth: []

tags:
  - name: operations
  - name: spaces
  - name: files
  - name: packages
    description: A space's own Python packages (requirements.txt), built into a package set its runs import
  - name: runs
  - name: functions
  - name: sessions
    description: |
      Interactive sessions: a notebook's live kernel, with a run's isolation
      (no network, the run limits, the space's package set). Run a cell, see
      its output, keep the variables; completion and docs from the real
      objects. Jupyter messages over a WebSocket (docs/sessions.md).
  - name: connections
    description: |
      A user's data sources (PostgreSQL, MySQL, SQL Server, object storage, an
      HTTP API), named in their spaces per environment, read where the data
      lives (docs/plan-data-access.md). A connection's secret goes to the
      configured secret provider and is never returned. Off unless
      connections.enabled; while off, every route here is 404.
  - name: admin
    description: Every owner's spaces and runs, draining, and the audit log, for administrators (scope nbsandbox.admin)

paths:
  /healthz:
    get:
      tags: [operations]
      summary: Liveness (the process serves HTTP)
      security: []
      responses:
        "200": { description: Alive, content: { application/json: { schema: { $ref: "#/components/schemas/Liveness" } } } }

  /readyz:
    get:
      tags: [operations]
      summary: Readiness (database, Docker, runner image, runtime, data directory)
      security: []
      responses:
        "200": { description: Ready, content: { application/json: { schema: { $ref: "#/components/schemas/ReadyReport" } } } }
        "503": { description: Not ready; each failing check says why, content: { application/json: { schema: { $ref: "#/components/schemas/ReadyReport" } } } }

  /metrics:
    get:
      tags: [operations]
      summary: Prometheus metrics (internal; not exposed through the reverse proxy)
      security: []
      responses:
        "200": { description: Prometheus text format, content: { text/plain: { schema: { type: string } } } }

  /v1/spaces:
    post:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.spaces.write] }]
      tags: [spaces]
      summary: Create a space
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Space" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.read] }]
      tags: [spaces]
      summary: List the caller's spaces, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: One page, content: { application/json: { schema: { $ref: "#/components/schemas/SpaceList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/spaces/{id}:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.read] }]
      tags: [spaces]
      summary: Space details with usage
      responses:
        "200": { description: The space, content: { application/json: { schema: { $ref: "#/components/schemas/Space" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.spaces.write] }]
      tags: [spaces]
      summary: Rename
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "200": { description: Renamed, content: { application/json: { schema: { $ref: "#/components/schemas/Space" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.spaces.write] }]
      tags: [spaces]
      summary: Delete the space with all files and runs
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/spaces:
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.admin] }]
      tags: [admin]
      summary: Every owner's spaces, newest first (administrators)
      description: |
        Needs the nbsandbox.admin scope: a token that carries it, or a basic
        user with `admin: true` in users.yaml. `owner` narrows the list to one
        caller ID.
      parameters:
        - name: owner
          in: query
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: One page, content: { application/json: { schema: { $ref: "#/components/schemas/AdminSpaceList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/spaces/{id}:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
    patch:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.admin] }]
      tags: [admin]
      summary: Give a space to another owner (administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [owner]
              properties:
                owner: { type: string, minLength: 1, maxLength: 512, description: The new owner's caller ID }
      responses:
        "200": { description: The space, content: { application/json: { schema: { $ref: "#/components/schemas/AdminSpace" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.admin] }]
      tags: [admin]
      summary: Delete any owner's space with all files and runs (administrators)
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/runs:
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.admin] }]
      tags: [admin]
      summary: Every owner's runs, newest first (administrators)
      description: |
        Metadata only, with the owner: never results or outputs. Narrow with
        `status`, `owner` (a caller ID), `space` and `worker` (the worker that
        holds or held the run, as `GET /v1/workers` names it).
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: owner, in: query, required: false, schema: { type: string } }
        - { name: space, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: worker, in: query, required: false, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: One page, content: { application/json: { schema: { $ref: "#/components/schemas/AdminRunList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/sessions:
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.admin] }]
      tags: [admin]
      summary: Every open interactive session, with its owner and worker (administrators)
      description: |
        Narrow with `worker`: the sessions one worker holds. A single process
        (role `all`) holds its sessions without naming itself.
      parameters:
        - { name: worker, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Open sessions, content: { application/json: { schema: { $ref: "#/components/schemas/SessionList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/sessions/{session_id}/end:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.admin] }]
      tags: [admin]
      summary: End any owner's session (administrators)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { description: Ended, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.admin] }]
      tags: [admin]
      summary: Stop any owner's run (administrators)
      description: The run's `cancelled_by` is the administrator. A running run stops asynchronously.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "202": { description: Cancel requested, content: { application/json: { schema: { $ref: "#/components/schemas/AdminRun" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/drain:
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.admin] }]
      tags: [admin]
      summary: Whether the workers are drained (administrators)
      responses:
        "200": { description: The drain state, content: { application/json: { schema: { $ref: "#/components/schemas/Drain" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.admin] }]
      tags: [admin]
      summary: Drain or resume the workers (administrators)
      description: |
        While draining, no worker starts a queued run; running runs finish,
        and new runs are still accepted (they wait, queued). Maintenance can
        start once `running_runs` is 0. Setting `draining` to false resumes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draining]
              properties:
                draining: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { description: The drain state, content: { application/json: { schema: { $ref: "#/components/schemas/Drain" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/audit:
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.admin] }]
      tags: [admin]
      summary: The audit log, newest first (administrators)
      description: |
        Every change, download and administrative operation, refused ones
        included (docs/operations.md#audit-log). Reading it is recorded too.
      parameters:
        - { name: actor, in: query, required: false, description: A caller ID, schema: { type: string } }
        - { name: space, in: query, required: false, schema: { type: string } }
        - { name: action, in: query, required: false, description: An operation, e.g. CreateRun, schema: { type: string } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: until, in: query, required: false, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: One page, content: { application/json: { schema: { $ref: "#/components/schemas/AuditList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/spaces/{id}/files:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
    post:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.files.write] }]
      tags: [files]
      summary: Upload files (all or nothing)
      description: |
        multipart/form-data with one or more parts named "file". Each part's
        filename must be a plain name; use `folder` to put files in a folder.
        Notebooks (.ipynb) must be nbformat 4. Existing files are replaced.
      parameters:
        - name: folder
          in: query
          required: false
          description: Destination folder, relative to the space (not under runs/).
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "201": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/UploadResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.read] }]
      tags: [files]
      summary: List the space's files and folders (folders first in their place, sorted by path)
      responses:
        "200": { description: Files sorted by path, content: { application/json: { schema: { $ref: "#/components/schemas/FileList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/spaces/{id}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
      - $ref: "#/components/parameters/FilePath"
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.read] }]
      tags: [files]
      summary: Download a file (always as an attachment; ETag is the file's version)
      responses:
        "200":
          description: The file
          headers:
            ETag: { description: The file's version, for If-Match when saving, schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "304": { description: Not modified (If-None-Match matched) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: If-Match didn't match }
    put:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.files.write] }]
      tags: [files]
      summary: Create or replace one file with the raw request body
      description: |
        Replacing an existing file needs If-Match with the version being
        replaced (from the ETag of a download, or a listing's version), so
        two editors can't overwrite each other. If-None-Match: * creates
        only. Same limits, quota and notebook validation as uploads.
      parameters:
        - { name: If-Match, in: header, required: false, schema: { type: string } }
        - { name: If-None-Match, in: header, required: false, schema: { type: string, enum: ["*"] } }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Replaced, content: { application/json: { schema: { $ref: "#/components/schemas/File" } } } }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/File" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/VersionConflict" }
    patch:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.files.write] }]
      tags: [files]
      summary: Rename or move a file or folder
      parameters:
        - { name: If-Match, in: header, required: false, description: Move a file only if it is still this version, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path]
              properties:
                path: { type: string, description: The new path; must not exist yet }
      responses:
        "200": { description: Moved, content: { application/json: { schema: { $ref: "#/components/schemas/File" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/VersionConflict" }
    delete:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.files.write] }]
      tags: [files]
      summary: Delete a file, or a folder (an empty one, or with recursive=true everything in it)
      parameters:
        - { name: recursive, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/spaces/{id}/folders:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
    post:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.files.write] }]
      tags: [files]
      summary: Create an empty folder (and any missing parents)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path]
              properties:
                path: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/File" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/connections:
    post:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.connections] }]
      tags: [connections]
      summary: Create a connection
      description: |
        A data source of the caller's. Settings depend on the type; unknown
        settings are refused (a secret never goes in them). The host must be
        one the operator allows (connections.allowed); loopback and
        link-local addresses never are. The secret is its value (stored by
        nbsandbox's secret provider: managed) or a reference to a secret the
        provider already holds (Kubernetes: name#key, a Secret in the runs
        namespace). Databases need one; an open API doesn't.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, type, settings]
              properties:
                name: { type: string, pattern: "^[a-z][a-z0-9_-]{0,62}$" }
                type: { type: string, enum: [postgresql, mysql, sqlserver, s3, azureblob, http] }
                settings: { $ref: "#/components/schemas/ConnectionSettings" }
                secret: { $ref: "#/components/schemas/ConnectionSecretInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.read] }]
      tags: [connections]
      summary: The caller's connections
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/connections/{connection_id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionID"
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.read] }]
      tags: [connections]
      summary: A connection, with where it is used
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.connections] }]
      tags: [connections]
      summary: Rename a connection, replace its settings, or replace its secret
      description: Settings, when given, replace them all. A new secret replaces the old one at once, for every space using the connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, pattern: "^[a-z][a-z0-9_-]{0,62}$" }
                settings: { $ref: "#/components/schemas/ConnectionSettings" }
                secret: { $ref: "#/components/schemas/ConnectionSecretInput" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.connections] }]
      tags: [connections]
      summary: Delete a connection, and its managed secret
      description: Refused (409) while a space binds it.
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/spaces/{id}/connections:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.read] }]
      tags: [connections]
      summary: What names mean in the space, per environment
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SpaceConnections" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.connections] }]
      tags: [connections]
      summary: Replace the space's environments and bindings
      description: |
        Each environment binds names (used in SQL: crm.orders) to the caller's
        connections, by name or ID. Every environment must bind the same
        names. default_environment is required with several environments.
        An empty environments object unbinds everything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                default_environment: { type: string }
                environments:
                  type: object
                  description: environment -> { name -> connection name or ID }
                  additionalProperties:
                    type: object
                    additionalProperties: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SpaceConnections" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/spaces/{id}/packages:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
    get:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.read] }]
      tags: [packages]
      summary: The space's own packages (its requirements.txt, built into a package set)
      description: |
        The package set the space's requirements.txt needs now and how far
        its build is. Never starts a build. `disabled` when this nbsandbox
        has package sets off (docs/packages.md).
      responses:
        "200": { description: The space's packages, content: { application/json: { schema: { $ref: "#/components/schemas/SpacePackages" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      security: [{ basicAuth: [] }, { bearerAuth: [nbsandbox.runs] }]
      tags: [packages]
      summary: Build the space's requirements.txt now
      description: |
        Runs and publishes that need the set then find it built. 202 while
        it builds; 200 when it is already built, or failed recently (the
        build log says why).
      responses:
        "202": { description: Building, content: { application/json: { schema: { $ref: "#/components/schemas/SpacePackages" } } } }
        "200": { description: Built, or failed, content: { application/json: { schema: { $ref: "#/components/schemas/SpacePackages" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/spaces/{id}/functions:
    parameters:
