#
# Binaries, checksums and SBOMs for a release. Container images
# are built by .github/workflows/release.yml. See docs/releasing.md.
version: 2

project_name: nbsandbox

before:
  hooks:
    - go mod verify

builds:
  - id: nbsandboxd
    main: ./cmd/nbsandboxd
    binary: nbsandboxd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
  - id: nbsandbox-report
    main: ./cmd/nbsandbox-report
    binary: nbsandbox-report
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - config/settings.yaml
      - deploy/docker-compose.yml
      - deploy/Caddyfile
      - deploy/.env.example
      - deploy/observability/*
      - deploy/provision/provision.sh
      - scripts/preflight.sh
      - scripts/backup.sh
      - scripts/nbsandbox.sh

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
    artifacts: checksum

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Security
      regexp: '^.*?sec(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude: ["^docs:", "^test:", "^chore\\(deps\\):"]

release:
  github:
    owner: azbyluthfan
    name: nbsandbox
  prerelease: auto
  extra_files:
    - glob: ./docs/isolation-report.md
  footer: |
    **Isolation evidence:** `isolation-report.md` attached to this release was
    generated by `make report` for this exact commit.
